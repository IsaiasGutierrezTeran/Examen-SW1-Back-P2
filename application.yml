spring:
  data:
    mongodb:
      # Spring Boot 4.0.6 no aplica credenciales (credential=null) -> Mongo SIN auth.
      uri: ${MONGO_URI:mongodb://localhost:27017/tramites_db}
      auto-index-creation: true
server:
  port: 8080
app:
  jwt:
    secret: "clave-ultra-secreta-para-firmar-tokens-cambiar-en-produccion-minimo-256-bits"
    expiration-ms: 86400000
    issuer: "tramites-backend"
